<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Reviews</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<!--
  L.A. Mortgage Dude - Google reviews carousel (reviews that mention Rajesh)
  Data: reviews.json in this repo, refreshed by a scheduled task on the 1st and 15th.
  Embed in Wix: Add > Embed Code > Embed HTML > "Website address" > this page's URL.
-->
<style>
  :root {
    --ink: #111111;
    --paper: #ffffff;
    --card: #ffffff;
    --soft: #f2f2f0;
    --line: #d6d6d6;   /* light gray borders */
    --sub: #3d3d3d;   /* secondary text stays dark - no light gray */
    --gap: 22px;
    --per: 3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: "Barlow", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 28px; }

  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  .head h2 { font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: clamp(21px, 2.7vw, 30px); line-height: 1.1; margin: 0; }
  .meta { font-size: 16px; font-weight: 500; color: var(--sub); margin-top: 6px; }
  .meta a, .meta a:visited, .meta a:hover { color: var(--ink); text-decoration: none; font-weight: inherit; }
  .meta .stars { letter-spacing: 1px; color: var(--ink); }

  .nav { display: flex; gap: 10px; flex-shrink: 0; }
  .nav button {
    width: 46px; height: 46px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;
    border-radius: 48% 52% 50% 50% / 52% 48% 52% 48%;   /* slightly hand-drawn circle */
    transition: border-color .12s;
  }
  .nav button svg { width: 18px; height: 18px; display: block; flex: none;
  }
  .nav button:hover:not(:disabled) { border-color: var(--ink); }
  .nav button:disabled { opacity: .35; cursor: default; }
  .nav button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .track {
    display: flex; gap: var(--gap); overflow-x: auto; scroll-snap-type: x mandatory;
    scroll-behavior: smooth; padding: 6px 6px 14px; margin: 0 -6px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .track::-webkit-scrollbar { display: none; }

  .card {
    flex: 0 0 calc((100% - (var(--per) - 1) * var(--gap)) / var(--per));
    scroll-snap-align: start;
    background: var(--card); border: 1.5px solid var(--line);
    border-radius: 14px 6px 16px 5px / 6px 15px 5px 14px;   /* uneven corners: clean but handmade */
    padding: 24px 22px 20px; display: flex; flex-direction: column; min-height: 300px;
  }
  .card:nth-child(3n+2) { border-radius: 6px 15px 6px 16px / 15px 5px 14px 6px; }
  .card:nth-child(3n)   { border-radius: 16px 5px 12px 7px / 5px 13px 7px 16px; }

  .q { font-family: "Playfair Display", Georgia, serif; font-size: 64px; line-height: .6; height: 26px; margin-bottom: 4px; }
  .rstars { font-size: 17px; letter-spacing: 2px; margin-bottom: 12px; }
  .text {
    font-size: 17px; line-height: 1.55; color: var(--ink); margin: 0; white-space: pre-line;
    display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card.open .text { display: block; -webkit-line-clamp: unset; max-height: calc(7 * 1.55em); overflow-y: auto; padding-right: 6px; }  /* expands in place; widget height never changes */
  .more {
    align-self: flex-start; margin-top: 10px; padding: 0; border: 0; background: none; cursor: pointer;
    font: 600 15px "Barlow", sans-serif; color: var(--ink); text-decoration: none;
  }
  .who { margin-top: auto; padding-top: 18px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-top: 1.5px dashed var(--line); margin-top: auto; }
  .card .spacer { flex: 1; min-height: 14px; }
  .name { font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 19px; }
  .date { font-size: 14px; font-weight: 500; color: var(--sub); white-space: nowrap; }

  .dots { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .dots button { width: 10px; height: 10px; padding: 0; border: 1.5px solid var(--line); border-radius: 50%; background: var(--paper); cursor: pointer; }
  .dots button[aria-current="true"] { background: #a8a8a8; border-color: #a8a8a8; }

  @media (max-width: 960px) { :root { --per: 2; } }
  @media (max-width: 600px) {
    :root { --per: 1; --gap: 16px; }
    .card { flex-basis: 86%; min-height: 0; }   /* peek of next card signals side-scroll */
    .head { align-items: center; }
    .nav button { width: 40px; height: 40px; }
    .nav button svg { width: 16px; height: 16px; }
    .meta .stars { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .track { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h2>What clients say</h2>
      <div class="meta" id="meta"></div>
    </div>
    <div class="nav">
      <button id="prev" aria-label="Previous reviews"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></button>
      <button id="next" aria-label="Next reviews"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button>
    </div>
  </div>
  <div class="track" id="track" aria-live="polite"></div>
  <div class="dots" id="dots"></div>
</div>

<script>
(function () {
  const SOURCES = [
    "https://raw.githubusercontent.com/MrBhavnani/lamd-reviews/main/reviews.json",
    "https://cdn.jsdelivr.net/gh/MrBhavnani/lamd-reviews@main/reviews.json"
  ];
  // On GitHub Pages, read the same-origin copy first (always current, no cross-site request).
  if (/\.github\.io$/.test(location.hostname)) SOURCES.unshift("reviews.json");
  // Built-in snapshot - used only if every source is blocked, so the widget is never empty.
  const FALLBACK = /*SNAPSHOT*/{"place_name":"Equitable Lending","place_rating":5.0,"place_total_reviews":171,"maps_url":"https://www.google.com/maps?cid=11857656974798046533","keyword":"Rajesh|Ragesh|Raj","scraped_at":"2026-11-10T16:33:56+00:00","scraped_review_count":171,"source":"signed-in Chrome","reviews":[{"id":"770c1d4701b2","author":"Marc McCormick","author_url":"","photo":"","rating":5,"date":"4 days ago","text":"Rajesh and the Equitable team went above and beyond for my client and myself. I'm definitely including Rajesh in my front line go-to lenders now."},{"id":"979000c86e22","author":"Jennifer M","author_url":"https://www.google.com/maps/contrib/116213193677706061565","photo":"","rating":5,"date":"2 months ago","text":"I had a wonderful experience with Equitable Lending & I especially want to recognize Rajesh Bhavnani for his professionalism, knowledge, and speed. He made the entire process smooth and easy and they closed my DSCR loan in 2 weeks! He took the time to answer all of my questions, the loan terms offered were exactly what he quoted upfront and he was able to schedule a rush appraisal very quickly. His processing team, Anthony and Carolina were very professional and as a real estate investor who has done many loans I can say this was the best loan team I’ve worked with. I highly recommend Rajesh and the team at Equitable Lending to anyone looking for a trustworthy & knowledgeable lending professional!"},{"id":"ae425fc55156","author":"Ty Upshaw","author_url":"https://www.google.com/maps/contrib/107368185678562959416","photo":"","rating":5,"date":"2 months ago","text":"I came across a profile on Zillow that was just full of five star ratings on this one broker named Ragesh Bhavnani.  And here I am now wishing I could give him 10 stars!  Ragesh simply sets the bar sky high for the industry to say the least. I've been in the realestate business for maybe 20yrs on and off,  I've  had a plethora of mortgage brokers close deals for me,  none even come close to the  meticulous attention and expert guidance I got from Ragesh.\nListen people, I would call Ragesh after hours and he would answer every single time!  He got me approved for a VA construction loan to build my dream home in Georgia.   Rajesh took me under his wing and guided me through to the closing table,  and let me tell you,  there were major hurdles along the way and the man never even blinked!!! I'm talking Clint Eastwood cool here folks!,,, he's confident and he's an expert.,,period.  Glad we met my friend, now lets do another new construction deal!!"},{"id":"681fb42bac2e","author":"Astrid Sanchez","author_url":"","photo":"","rating":5,"date":"2 months ago","text":"Rajesh and his team are very thorough and patient. Rajesh took the time to explain everything in detail. No matter what question I had, he responded quickly. I appreciated the process."},{"id":"18b41cc15a4d","author":"Iris Property Ventures LLC","author_url":"","photo":"","rating":5,"date":"10 months ago","text":"Raj and Adrian at Equitable Lending are absolutely incredible! Their speed, responsiveness, and attention to detail blew me away!  I’ve never worked with a team so on top of everything. From start to finish, they made the loan process smooth, effortless, and stress-free, and I always felt completely supported. The fastest close I’ve ever experienced! They are truly the best company I’ve ever come across, and I will always work with Equitable Lending for every property I purchase. If you want a team that delivers results quickly, professionally, and with unmatched care, Raj and Adrian are simply the best!"},{"id":"6a462049cda2","author":"Sarah Dunbar-Riley","author_url":"","photo":"","rating":5,"date":"10 months ago","text":"I cannot say enough about our lender, Rajesh Bhavnani . He is truly outstanding and amazing All in One! Rajesh is extremely communicative, always ready to speak with you, and consistently gets back to you almost instantly. He’s always available to go back and forth, run numbers, and provide valuable suggestions.\n\nMoreover, Rajesh truly takes into account the needs of your family, assisting you where you are and helping you get to where you need to be to purchase your home. I truly believe that without Rajesh’s guidance, I would not be purchasing right now. The process can be very overwhelming, but Rajesh simplified it and made it feel feasible, and I never felt alone at any part of the way.\n\nI look forward to purchasing any future homes with Rajesh and know we’ll always be in the best hands. For Rajesh, it’s not just about the purchase; it’s about ensuring the home or property is the best fit for your needs and that your financials support what’s required.\n\nI would recommend him a million percent to anyone in need of a lender! Thank you so Much Rajesh and Equitable Lending for Making a home buying dream into a reality!\n\nThank you so much again,\nSarah Dunbar-Riley"},{"id":"cd94a09e38e1","author":"jennette jefferson","author_url":"","photo":"","rating":5,"date":"a year ago","text":"Rajesh at Equitable Lending has a special ability to deal with the most challenging issues in the whole refinancing world and he will always deliver what he promises-one way  or another he will get you your mortgage even in the face of more difficult and uncertain twists and turns in the market.\nI recommend Equitable Lending and Rajesh Bhavnani as you are buying peace of mind upfront. Thank you Rajesh. I will be back very soon. You are amazing."},{"id":"0c762e3fa43d","author":"diana arias","author_url":"","photo":"","rating":5,"date":"a year ago","text":"Rajesh and Adrian were perfect. 100% transparency."}]}/*END*/;

  const track = document.getElementById("track");
  const meta = document.getElementById("meta");
  const dots = document.getElementById("dots");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const stars = n => "★★★★★".slice(0, n) + "☆☆☆☆☆".slice(0, 5 - n);

  function render(d) {
    const list = (d.reviews || []).filter(r => r.text && (r.rating || 5) >= 4);
    const url = d.maps_url || "https://www.google.com/maps?cid=11857656974798046533";
    meta.innerHTML = `<span class="stars">★★★★★</span> ${Number(d.place_rating || 5).toFixed(1)} · ` +
      `<a href="${esc(url)}" target="_blank" rel="noopener">${d.place_total_reviews || ""} Google reviews</a>`;
    track.innerHTML = list.map(r => `
      <article class="card">
        <div class="q" aria-hidden="true">&ldquo;</div>
        <div class="rstars" aria-label="${r.rating || 5} out of 5 stars">${stars(r.rating || 5)}</div>
        <p class="text">${esc(r.text.trim())}</p>
        <button class="more" hidden>Read more</button>
        <div class="spacer"></div>
        <div class="who"><span class="name">${esc(r.author)}</span><span class="date">${esc(r.date || "")}</span></div>
      </article>`).join("");
    track.querySelectorAll(".card").forEach(card => {
      const t = card.querySelector(".text"), b = card.querySelector(".more");
      if (t.scrollHeight > t.clientHeight + 2) b.hidden = false;
      b.onclick = () => { const o = card.classList.toggle("open"); b.textContent = o ? "Show less" : "Read more"; };
    });
    buildDots();
    update();
  }

  const perView = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--per")) || 1;
  const cards = () => [...track.children];
  const pages = () => Math.max(1, Math.ceil(cards().length / Math.round(perView())));

  function buildDots() {
    const n = pages();
    dots.innerHTML = n > 1 ? Array.from({ length: n }, (_, i) => `<button aria-label="Go to page ${i + 1}"></button>`).join("") : "";
    [...dots.children].forEach((b, i) => b.onclick = () => goTo(i * Math.round(perView())));
  }
  function goTo(idx) {
    const c = cards()[Math.max(0, Math.min(idx, cards().length - 1))];
    if (c) track.scrollTo({ left: c.offsetLeft - track.offsetLeft - 6 });
  }
  function firstVisible() {
    const x = track.scrollLeft + 10;
    return Math.max(0, cards().findIndex(c => c.offsetLeft - track.offsetLeft + c.offsetWidth / 2 > x));
  }
  function update() {
    const max = track.scrollWidth - track.clientWidth - 4;
    prev.disabled = track.scrollLeft <= 4;
    next.disabled = track.scrollLeft >= max;
    const step = Math.round(perView()), page = next.disabled ? pages() - 1 : Math.floor(firstVisible() / step);
    [...dots.children].forEach((b, i) => b.setAttribute("aria-current", i === page ? "true" : "false"));
  }
  prev.onclick = () => goTo(firstVisible() - Math.round(perView()));
  next.onclick = () => goTo(firstVisible() + Math.round(perView()));
  track.addEventListener("scroll", () => requestAnimationFrame(update), { passive: true });
  addEventListener("resize", () => { buildDots(); update(); });
  track.addEventListener("keydown", e => { if (e.key === "ArrowRight") next.click(); if (e.key === "ArrowLeft") prev.click(); });

  async function get(url) {
    const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 6000);
    try {
      const v = Math.floor(Date.now() / 3600000);
      const r = await fetch(url + "?v=" + v, { signal: ctrl.signal, cache: "no-cache" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      if (!Array.isArray(d.reviews)) throw new Error("bad data");
      return d;
    } finally { clearTimeout(t); }
  }
  (async () => {
    for (const u of SOURCES) { try { return render(await get(u)); } catch (e) { console.warn("reviews source failed", u, e.message); } }
    if (FALLBACK) render(FALLBACK);
  })();
})();
</script>
</body>
</html>
