<!--
  Google Reviews mentioning "Rajesh" — Wix Embed HTML widget (no API key)
  ----------------------------------------------------------------------
  Reads reviews.json that the GitHub scraper refreshes on the 1st and 15th of each month.

  SETUP: change REVIEWS_URL below to your repo, e.g.
    https://raw.githubusercontent.com/MrBhavnani/lamd-reviews/main/reviews.json

  In Wix: Add Elements → Embed Code → Embed HTML → "Code" → paste this whole file.
-->
<meta charset="utf-8">
<div id="rr-root">
  <div class="rr-head">
    <div class="rr-title">What clients say about Rajesh</div>
    <div class="rr-summary" id="rr-summary"></div>
  </div>
  <div class="rr-grid" id="rr-grid"><div class="rr-msg">Loading reviews&hellip;</div></div>
  <div class="rr-foot">
    <a id="rr-more" href="#" target="_blank" rel="noopener">See all reviews on Google</a>
    <span>Reviews from Google</span>
  </div>
</div>

<style>
  :root {
    --rr-bg: transparent;
    --rr-card: #ffffff;
    --rr-text: #1b1f24;
    --rr-muted: #5f6b76;
    --rr-accent: #0b5cad;
    --rr-star: #f5a623;
    --rr-border: #e3e7eb;
    --rr-radius: 12px;
    --rr-font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  html, body { margin: 0; background: var(--rr-bg); }
  #rr-root { font-family: var(--rr-font); color: var(--rr-text); padding: 16px; box-sizing: border-box; }
  .rr-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
  .rr-title { font-size: 22px; font-weight: 700; }
  .rr-summary { font-size: 14px; color: var(--rr-muted); }
  .rr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .rr-card { background: var(--rr-card); border: 1px solid var(--rr-border); border-radius: var(--rr-radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .rr-author { display: flex; align-items: center; gap: 10px; }
  .rr-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #dfe5ea; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--rr-muted); }
  .rr-name { font-weight: 600; font-size: 15px; color: var(--rr-text); text-decoration: none; }
  .rr-name:hover { text-decoration: underline; }
  .rr-date { font-size: 12px; color: var(--rr-muted); }
  .rr-stars { color: var(--rr-star); font-size: 16px; letter-spacing: 1px; }
  .rr-text { font-size: 15px; line-height: 1.55; margin: 0; white-space: pre-line; }
  .rr-text mark { background: #fff3c4; color: inherit; padding: 0 2px; border-radius: 3px; }
  .rr-toggle { background: none; border: 0; padding: 0; color: var(--rr-accent); font: inherit; font-size: 14px; cursor: pointer; align-self: flex-start; }
  .rr-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 16px; font-size: 13px; color: var(--rr-muted); }
  .rr-foot a { color: var(--rr-accent); text-decoration: none; font-weight: 600; }
  .rr-msg { color: var(--rr-muted); font-size: 15px; }
</style>

<script>
  /* ===== CONFIG ===== */
  const REVIEWS_URL = "https://raw.githubusercontent.com/MrBhavnani/lamd-reviews/main/reviews.json";
  const KEYWORDS    = ["Rajesh", "Ragesh", "Raj"];   // highlighted in the review text
  const MAX_CHARS   = 320;        // truncate long reviews (0 = never)
  const MIN_RATING  = 1;          // set to 4 or 5 to hide lower ratings
  const MAX_SHOWN   = 0;          // limit how many cards show (0 = all)
  /* ================== */

  const grid = document.getElementById("rr-grid");
  const summaryEl = document.getElementById("rr-summary");
  const moreLink = document.getElementById("rr-more");
  const kw = KEYWORDS.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  const kwRegexG = new RegExp("\\b(" + kw + ")\\b", "gi");

  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function stars(n) { const r = Math.max(0, Math.min(5, Math.round(n || 0))); return "\u2605".repeat(r) + "\u2606".repeat(5 - r); }
  function highlight(s) { return esc(s).replace(kwRegexG, "<mark>$1</mark>"); }
  function safeUrl(u) { return /^https:\/\//i.test(u || "") ? u : ""; }

  function card(r) {
    const full = r.text || "";
    const needsCut = MAX_CHARS > 0 && full.length > MAX_CHARS;
    const short = needsCut ? full.slice(0, MAX_CHARS).replace(/\s+\S*$/, "") + "\u2026" : full;
    const photo = safeUrl(r.photo), link = safeUrl(r.author_url);
    const avatar = photo
      ? `<img class="rr-avatar" src="${esc(photo)}" alt="" referrerpolicy="no-referrer" loading="lazy">`
      : `<div class="rr-avatar">${esc((r.author || "?").trim().charAt(0).toUpperCase())}</div>`;
    const name = link
      ? `<a class="rr-name" href="${esc(link)}" target="_blank" rel="noopener">${esc(r.author)}</a>`
      : `<span class="rr-name">${esc(r.author)}</span>`;

    const el = document.createElement("div");
    el.className = "rr-card";
    el.innerHTML = `
      <div class="rr-author">${avatar}<div>${name}<div class="rr-date">${esc(r.date)}</div></div></div>
      ${r.rating ? `<div class="rr-stars" aria-label="${esc(r.rating)} out of 5 stars">${stars(r.rating)}</div>` : ""}
      <p class="rr-text">${highlight(short)}</p>
      ${needsCut ? '<button class="rr-toggle">Read more</button>' : ""}`;
    if (needsCut) {
      const p = el.querySelector(".rr-text"), b = el.querySelector(".rr-toggle");
      let open = false;
      b.addEventListener("click", () => {
        open = !open;
        p.innerHTML = highlight(open ? full : short);
        b.textContent = open ? "Show less" : "Read more";
      });
    }
    // Hide broken avatar images gracefully
    const img = el.querySelector("img.rr-avatar");
    if (img) img.addEventListener("error", () => {
      const d = document.createElement("div");
      d.className = "rr-avatar";
      d.textContent = (r.author || "?").trim().charAt(0).toUpperCase();
      img.replaceWith(d);
    });
    return el;
  }

  // Sources tried in order. jsDelivr mirrors the same GitHub file (cached up to ~12h).
  const SOURCES = [
    REVIEWS_URL,
    "https://cdn.jsdelivr.net/gh/MrBhavnani/lamd-reviews@main/reviews.json"
  ];
  // Built-in snapshot (Nov 3, 2026) - shown only if every source is blocked,
  // so the widget never appears empty.
  const FALLBACK = {"place_name": "Equitable Lending", "place_rating": 5.0, "place_total_reviews": 170, "maps_url": "https://www.google.com/maps?cid=11857656974798046533", "keyword": "Rajesh|Ragesh|Raj", "scraped_at": "2026-11-03T16:02:28+00:00", "scraped_review_count": 161, "source": "signed-in Chrome", "reviews": [{"id": "979000c86e22", "author": "Jennifer M", "author_url": "https://www.google.com/maps/contrib/116213193677706061565", "photo": "", "rating": 5, "date": "2 months ago", "text": "I had a wonderful experience with Equitable Lending & I especially want to recognize Rajesh Bhavnani for his professionalism, knowledge, and speed. He made the entire process smooth and easy and they closed my DSCR loan in 2 weeks! He took the time to answer all of my questions, the loan terms offered were exactly what he quoted upfront and he was able to schedule a rush appraisal very quickly. His processing team, Anthony and Carolina were very professional and as a real estate investor who has done many loans I can say this was the best loan team I\u2019ve worked with. I highly recommend Rajesh and the team at Equitable Lending to anyone looking for a trustworthy & knowledgeable lending professional!"}, {"id": "ae425fc55156", "author": "Ty Upshaw", "author_url": "https://www.google.com/maps/contrib/107368185678562959416", "photo": "", "rating": 5, "date": "2 months ago", "text": "I came across a profile on Zillow that was just full of five star ratings on this one broker named Ragesh Bhavnani.  And here I am now wishing I could give him 10 stars!  Ragesh simply sets the bar sky high for the industry to say the least. I've been in the realestate business for maybe 20yrs on and off,  I've  had a plethora of mortgage brokers close deals for me,  none even come close to the  meticulous attention and expert guidance I got from Ragesh.\nListen people, I would call Ragesh after hours and he would answer every single time!  He got me approved for a VA construction loan to build my dream home in Georgia.   Rajesh took me under his wing and guided me through to the closing table,  and let me tell you,  there were major hurdles along the way and the man never even blinked!!! I'm talking Clint Eastwood cool here folks!,,, he's confident and he's an expert.,,period.  Glad we met my friend, now lets do another new construction deal!!"}, {"id": "681fb42bac2e", "author": "Astrid Sanchez", "author_url": "", "photo": "", "rating": 5, "date": "2 months ago", "text": "Rajesh and his team are very thorough and patient. Rajesh took the time to explain everything in detail. No matter what question I had, he responded quickly. I appreciated the process."}, {"id": "18b41cc15a4d", "author": "Iris Property Ventures LLC", "author_url": "", "photo": "", "rating": 5, "date": "10 months ago", "text": "Raj and Adrian at Equitable Lending are absolutely incredible! Their speed, responsiveness, and attention to detail blew me away!  I\u2019ve never worked with a team so on top of everything. From start to finish, they made the loan process smooth, effortless, and stress-free, and I always felt completely supported. The fastest close I\u2019ve ever experienced! They are truly the best company I\u2019ve ever come across, and I will always work with Equitable Lending for every property I purchase. If you want a team that delivers results quickly, professionally, and with unmatched care, Raj and Adrian are simply the best!"}, {"id": "cd94a09e38e1", "author": "jennette jefferson", "author_url": "", "photo": "", "rating": 5, "date": "a year ago", "text": "Rajesh at Equitable Lending has a special ability to deal with the most challenging issues in the whole refinancing world and he will always deliver what he promises-one way  or another he will get you your mortgage even in the face of more difficult and uncertain twists and turns in the market.\nI recommend Equitable Lending and Rajesh Bhavnani as you are buying peace of mind upfront. Thank you Rajesh. I will be back very soon. You are amazing."}, {"id": "0c762e3fa43d", "author": "diana arias", "author_url": "", "photo": "", "rating": 5, "date": "a year ago", "text": "Rajesh and Adrian were perfect. 100% transparency."}]};

  function show(data) {
    if (data.maps_url) moreLink.href = data.maps_url;
    if (data.place_rating) {
      summaryEl.textContent = `${Number(data.place_rating).toFixed(1)} \u2605` +
        (data.place_total_reviews ? ` \u00b7 ${data.place_total_reviews} Google reviews` : "");
    }
    let list = (data.reviews || []).filter(r => (r.rating || 5) >= MIN_RATING && r.text);
    if (MAX_SHOWN > 0) list = list.slice(0, MAX_SHOWN);
    grid.innerHTML = "";
    if (!list.length) { grid.innerHTML = `<div class="rr-msg">Reviews coming soon.</div>`; return; }
    list.forEach(r => grid.appendChild(card(r)));
  }

  async function fetchJson(url) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 6000);
    try {
      const bust = Math.floor(Date.now() / 3600000);   // refetch at most hourly
      const res = await fetch(url + (url.includes("?") ? "&" : "?") + "v=" + bust, { signal: ctrl.signal });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!data || !Array.isArray(data.reviews)) throw new Error("bad data");
      return data;
    } finally { clearTimeout(t); }
  }

  async function load() {
    for (const url of SOURCES) {
      try { show(await fetchJson(url)); return; }
      catch (e) { console.warn("Reviews source failed:", url, e.message || e); }
    }
    console.warn("All review sources blocked - showing built-in snapshot");
    show(FALLBACK);
  }
  load();
</script>
