name: Scrape Google reviews

on:
  # Schedule removed: Google limits signed-out visitors to 5 reviews, so this cloud scraper
  # can't see them. reviews.json is now refreshed from Rajesh's signed-in Chrome by a
  # Claude scheduled task. Kept for manual runs only.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Scrape
        env:
          MAPS_URL: ${{ vars.MAPS_URL || 'https://www.google.com/maps?cid=11857656974798046533' }}
          KEYWORD: ${{ vars.KEYWORD || 'Rajesh' }}
        run: python scrape_reviews.py

      - name: Save debug screenshot if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore

      - name: Commit updated reviews.json
        run: |
          git config user.name  "reviews-bot"
          git config user.email "reviews-bot@users.noreply.github.com"
          git add reviews.json
          git diff --cached --quiet || git commit -m "Update reviews $(date -u +%Y-%m-%d)"
          git push
